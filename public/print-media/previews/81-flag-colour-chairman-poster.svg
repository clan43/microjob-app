<text x="60" y="192" font-size="7" fill="#ffe600" font-weight="800" text-anchor="middle" stroke="#7a0010" stroke-width="0.49" stroke-linejoin="round" paint-order="stroke" data-layer-name="Ward">ওয়ার্ড নং ___</text>
<circle cx="147" cy="118" r="57" fill="#ffe600" data-layer-name="Yellow ring"/>
<circle cx="147" cy="118" r="53" fill="#0a7a3c" data-layer-name="Green ring"/>
<circle cx="147" cy="118" r="49" fill="#e5e7eb" stroke="#9ca3af" stroke-width="0.5" stroke-dasharray="2 1.2" id="photo_placeholder" data-object-type="image" data-layer-name="ছবি"/>
<text x="147" y="120" font-size="4" fill="#6b7280" font-weight="500" text-anchor="middle" id="photo_placeholder_hint" data-layer-name="ছবি hint">প্রার্থীর ছবি দিন</text>
<circle cx="168" cy="205" r="16" fill="#ffffff" stroke="#e4172b" stroke-width="0.8" stroke-dasharray="2 1.2" id="symbol_placeholder" data-object-type="image" data-layer-name="প্রতীক বৃত্ত"/>
<text x="168" y="206.5" font-size="6.08" fill="#6b7280" font-weight="500" text-anchor="middle" data-layer-name="প্রতীক hint">প্রতীক</text>
<text x="168" y="226" font-size="4.2" fill="#7a0010" font-weight="700" text-anchor="middle" data-layer-name="Symbol label">মার্কা: ____</text>
<rect x="6" y="230" width="198" height="22" rx="3" fill="#ffe600" stroke="#e4172b" stroke-width="0.8" data-layer-name="Name strip"/>
<text x="105" y="246" font-size="16" fill="#e4172b" font-weight="800" text-anchor="middle" data-layer-name="Candidate name">প্রার্থীর নাম</text>
<rect x="0" y="254" width="210" height="16" rx="0" fill="#27269b" data-layer-name="Appeal band"/>
