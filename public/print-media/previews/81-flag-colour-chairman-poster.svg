<rect x="0" y="270" width="210" height="27" rx="0" fill="#ffe600" data-layer-name="Contact strip"/>
<text x="105" y="280" font-size="5.6" fill="#e4172b" font-weight="800" text-anchor="middle" data-layer-name="Campaign by">প্রচারে: এলাকার সর্বস্তরের জনগণ।</text>
<text x="105" y="289" font-size="5" fill="#7a0010" font-weight="700" text-anchor="middle" data-layer-name="Contact">যোগাযোগ: ০১XXX-XXXXXX</text>
</svg>
