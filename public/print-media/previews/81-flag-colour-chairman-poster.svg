<polygon points="8,98 112,102 108,126 12,122" fill="#27269b" data-layer-name="Post banner"/>
<text x="60" y="118" font-size="13" fill="#fff" font-weight="800" text-anchor="middle" data-layer-name="Post title">মেম্বার</text>
<rect x="40" y="130" width="40" height="9" rx="2" fill="#ffe600" data-layer-name="Pode tag"/>
<text x="60" y="136.5" font-size="6" fill="#e4172b" font-weight="800" text-anchor="middle" data-layer-name="Pode">পদে</text>
<text x="60" y="152" font-size="8" fill="#fff" font-weight="800" text-anchor="middle" stroke="#7a0010" stroke-width="0.56" stroke-linejoin="round" paint-order="stroke" data-layer-name="Servant line 1">আপনাদের সেবক</text>
<text x="60" y="162" font-size="8" fill="#fff" font-weight="800" text-anchor="middle" stroke="#7a0010" stroke-width="0.56" stroke-linejoin="round" paint-order="stroke" data-layer-name="Servant line 2">হিসেবে</text>
<rect x="42" y="170" width="36" height="9" rx="2" fill="#27269b" data-layer-name="Ami tag"/>
