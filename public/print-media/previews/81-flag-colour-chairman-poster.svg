<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm" font-family="'Hind Siliguri', 'Noto Sans Bengali', 'Nirmala UI', sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e4172b"/><stop offset="0.5" stop-color="#ffe600"/><stop offset="1" stop-color="#c2218f"/></linearGradient></defs>
<rect x="0" y="0" width="210" height="297" rx="0" fill="url(#bg)" data-layer-name="Background"/>
<rect x="140" y="8" width="62" height="6.5" rx="1.5" fill="#0a7a3c" data-layer-name="Slogan tag 1"/>
<text x="171" y="12.8" font-size="3.6" fill="#fff" font-weight="700" text-anchor="middle" data-layer-name="Slogan 1">অগ্রযাত্রা আমার সময়</text>
<rect x="140" y="16" width="62" height="6.5" rx="1.5" fill="#e4172b" data-layer-name="Slogan tag 2"/>
<text x="171" y="20.8" font-size="3.6" fill="#fff" font-weight="700" text-anchor="middle" data-layer-name="Slogan 2">সততা আমার মূলধন</text>
<rect x="140" y="24" width="62" height="6.5" rx="1.5" fill="#c2218f" data-layer-name="Slogan tag 3"/>
<text x="171" y="28.8" font-size="3.6" fill="#fff" font-weight="700" text-anchor="middle" data-layer-name="Slogan 3">জনগণ আমার শক্তি</text>
<text x="60" y="22" font-size="9" fill="#fff" font-weight="800" text-anchor="middle" stroke="#7a0010" stroke-width="0.63" stroke-linejoin="round" paint-order="stroke" data-layer-name="Upcoming">আসন্ন</text>
<text x="60" y="39" font-size="13" fill="#ffe600" font-weight="800" text-anchor="middle" stroke="#7a0010" stroke-width="0.91" stroke-linejoin="round" paint-order="stroke" data-layer-name="Area name">এলাকার নাম</text>
<text x="60" y="52" font-size="9.5" fill="#fff" font-weight="800" text-anchor="middle" stroke="#7a0010" stroke-width="0.67" stroke-linejoin="round" paint-order="stroke" data-layer-name="Council">ইউনিয়ন পরিষদ</text>
<rect x="10" y="60" width="100" height="22" rx="3" fill="#ffffff" stroke="#e4172b" stroke-width="1" data-layer-name="Election box"/>
<text x="60" y="76.5" font-size="15" fill="#e4172b" font-weight="800" text-anchor="middle" data-layer-name="Election word">নির্বাচনে</text>
<rect x="34" y="86" width="52" height="7" rx="1.5" fill="#27269b" data-layer-name="Gender tag"/>
