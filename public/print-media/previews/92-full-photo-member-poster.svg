<text x="105" y="258" font-size="7.6" fill="#ffffff" font-weight="700" text-anchor="middle"  data-layer-name="Slogan">আপনার পাশে, আপনার সাথে, সবসময়</text>
<text x="105" y="266" font-size="5.6" fill="#ffe600" font-weight="700" text-anchor="middle"  data-layer-name="Appeal">আপনাদের দোয়া ও সমর্থন প্রত্যাশী</text>
<rect x="0" y="271" width="210" height="26" rx="0" fill="#0a7a3c"  data-layer-name="Contact strip"/>
<text x="105" y="281" font-size="5" fill="#ffffff" font-weight="700" text-anchor="middle"  data-layer-name="Campaign by">প্রচারে: এলাকার সর্বস্তরের জনগণ।</text>
<text x="105" y="289.5" font-size="5.6" fill="#ffe600" font-weight="800" text-anchor="middle"  data-layer-name="Contact">যোগাযোগ: ০১XXX-XXXXXX</text>
</svg>
