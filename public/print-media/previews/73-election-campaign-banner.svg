<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 90" width="240mm" height="90mm" font-family="'Hind Siliguri', 'Noto Sans Bengali', 'Nirmala UI', sans-serif">
<rect x="0" y="0" width="240" height="90" rx="0" fill="#0f172a"  data-layer-name="Background"/>
<rect x="0" y="0" width="240" height="90" rx="0" fill="#14532d" opacity="0.35" data-layer-name="Left glow"/>
<rect x="0" y="78" width="240" height="12" rx="0" fill="#dc2626"  data-layer-name="Bottom band"/>
<rect x="0" y="76" width="240" height="2" rx="0" fill="#facc15"  data-layer-name="Gold line"/>
<rect x="8" y="8" width="70" height="62" rx="4" fill="#facc15"  data-layer-name="Photo frame"/>
<rect x="10" y="10" width="66" height="58" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="0.5" stroke-dasharray="2 1.2" id="photo_placeholder" data-object-type="image" data-layer-name="ছবি"/>
<text x="43.0" y="39.0" font-size="4" fill="#6b7280" font-weight="500" text-anchor="middle" id="photo_placeholder_hint" data-layer-name="ছবি hint">প্রার্থীর ছবি দিন</text>
<text x="137.5" y="18" font-size="7" fill="#facc15" font-weight="700" text-anchor="middle"  data-layer-name="Election title">ইউনিয়ন পরিষদ নির্বাচন ২০২৬</text>
<text x="137.5" y="40" font-size="17" fill="#ffffff" font-weight="800" text-anchor="middle"  data-layer-name="Candidate name">প্রার্থীর নাম</text>
<rect x="80" y="46" width="115" height="12" rx="6" fill="#dc2626"  data-layer-name="Post ribbon"/>
<text x="137.5" y="55" font-size="7.5" fill="#ffffff" font-weight="800" text-anchor="middle"  data-layer-name="Post title">চেয়ারম্যান পদপ্রার্থী</text>
<text x="137.5" y="70" font-size="6" fill="#bbf7d0" font-weight="600" text-anchor="middle"  data-layer-name="Slogan">উন্নয়নের অঙ্গীকারে আপনার পাশে</text>
<circle cx="218" cy="30" r="17" fill="#ffffff" stroke="#facc15" stroke-width="0.8" stroke-dasharray="2 1.2" id="symbol_placeholder" data-object-type="image" data-layer-name="প্রতীক বৃত্ত"/>
<text x="218" y="31.2" font-size="6.46" fill="#6b7280" font-weight="500" text-anchor="middle"  data-layer-name="প্রতীক hint">প্রতীক</text>
<text x="218" y="52" font-size="4.5" fill="#facc15" font-weight="700" text-anchor="middle"  data-layer-name="Symbol label">মার্কা</text>
<text x="120" y="86" font-size="6" fill="#ffffff" font-weight="700" text-anchor="middle"  data-layer-name="Contact">যোগাযোগ: ০১XXX-XXXXXX  |  ভোটকেন্দ্র: ______</text>
</svg>
