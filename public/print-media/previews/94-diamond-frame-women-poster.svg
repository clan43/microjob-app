<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm" font-family="'Hind Siliguri', 'Noto Sans Bengali', 'Nirmala UI', sans-serif">
<defs><pattern id="lattice" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse"><polygon points="12,2 22,12 12,22 2,12" fill="#c2218f" fill-opacity="0.35"/></pattern></defs>
<rect x="0" y="0" width="210" height="297" rx="0" fill="#1b1f8a"  data-layer-name="Background"/>
<rect x="0" y="0" width="210" height="297" rx="0" fill="url(#lattice)"  data-layer-name="Diamond lattice"/>
<text x="105" y="11" font-size="6" fill="#ffffff" font-weight="700" text-anchor="middle"  data-layer-name="Election title">ইউনিয়ন পরিষদ নির্বাচন ২০২৬</text>
<text x="105" y="29" font-size="13.5" fill="#ffe600" font-weight="800" text-anchor="middle" stroke="#0b0f4a" stroke-width="1.1" stroke-linejoin="round" paint-order="stroke"  data-layer-name="Headline">সংরক্ষিত মহিলা আসন</text>
<text x="105" y="38.5" font-size="6.8" fill="#ffffff" font-weight="700" text-anchor="middle"  data-layer-name="Sub headline">সদস্য পদপ্রার্থী</text>
<polygon points="105,44 185,124 105,204 25,124" fill="#ffe600"  data-layer-name="Diamond yellow"/>
<polygon points="105,47.5 181.5,124 105,200.5 28.5,124" fill="#ffffff"  data-layer-name="Diamond white"/>
<polygon points="105,51 178,124 105,197 32,124" fill="#c2218f"  data-layer-name="Diamond magenta"/>
<circle cx="105" cy="124" r="50" fill="#e5e7eb" stroke="#9ca3af" stroke-width="0.5" stroke-dasharray="2 1.2" id="photo_placeholder" data-object-type="image" data-layer-name="ছবি"/>
<text x="105" y="125.5" font-size="4" fill="#6b7280" font-weight="500" text-anchor="middle" id="photo_placeholder_hint" data-layer-name="ছবি hint">প্রার্থীর ছবি দিন</text>
<polygon points="22,79 41,98 22,117 3,98" fill="#ffe600"  data-layer-name="Leader diamond 1"/>
<polygon points="22,81 39,98 22,115 5,98" fill="#e4172b"  data-layer-name="Leader diamond inner 1"/>
<circle cx="22" cy="98" r="11.5" fill="#e5e7eb" stroke="#9ca3af" stroke-width="0.5" stroke-dasharray="2 1.2" id="leader_photo_1" data-object-type="image" data-layer-name="নেতার ছবি 1"/>
<text x="22" y="99.5" font-size="3.6" fill="#6b7280" font-weight="500" text-anchor="middle" id="leader_photo_1_hint" data-layer-name="নেতার ছবি 1 hint">ছবি</text>
<polygon points="188,79 207,98 188,117 169,98" fill="#ffe600"  data-layer-name="Leader diamond 2"/>
<polygon points="188,81 205,98 188,115 171,98" fill="#e4172b"  data-layer-name="Leader diamond inner 2"/>
<circle cx="188" cy="98" r="11.5" fill="#e5e7eb" stroke="#9ca3af" stroke-width="0.5" stroke-dasharray="2 1.2" id="leader_photo_2" data-object-type="image" data-layer-name="নেতার ছবি 2"/>
<text x="188" y="99.5" font-size="3.6" fill="#6b7280" font-weight="500" text-anchor="middle" id="leader_photo_2_hint" data-layer-name="নেতার ছবি 2 hint">ছবি</text>
<polygon points="22,131 41,150 22,169 3,150" fill="#ffe600"  data-layer-name="Leader diamond 3"/>
<polygon points="22,133 39,150 22,167 5,150" fill="#e4172b"  data-layer-name="Leader diamond inner 3"/>
<circle cx="22" cy="150" r="11.5" fill="#e5e7eb" stroke="#9ca3af" stroke-width="0.5" stroke-dasharray="2 1.2" id="leader_photo_3" data-object-type="image" data-layer-name="নেতার ছবি 3"/>
<text x="22" y="151.5" font-size="3.6" fill="#6b7280" font-weight="500" text-anchor="middle" id="leader_photo_3_hint" data-layer-name="নেতার ছবি 3 hint">ছবি</text>
<polygon points="188,131 207,150 188,169 169,150" fill="#ffe600"  data-layer-name="Leader diamond 4"/>
<polygon points="188,133 205,150 188,167 171,150" fill="#e4172b"  data-layer-name="Leader diamond inner 4"/>
<circle cx="188" cy="150" r="11.5" fill="#e5e7eb" stroke="#9ca3af" stroke-width="0.5" stroke-dasharray="2 1.2" id="leader_photo_4" data-object-type="image" data-layer-name="নেতার ছবি 4"/>
<text x="188" y="151.5" font-size="3.6" fill="#6b7280" font-weight="500" text-anchor="middle" id="leader_photo_4_hint" data-layer-name="নেতার ছবি 4 hint">ছবি</text>
<polygon points="14,208 196,208 188,221 196,234 14,234 22,221" fill="#ffe600" stroke="#e4172b" stroke-width="0.9" data-layer-name="Name ribbon"/>
<text x="105" y="227" font-size="18" fill="#27269b" font-weight="800" text-anchor="middle"  data-layer-name="Candidate name">প্রার্থীর নাম</text>
<text x="105" y="248" font-size="7.8" fill="#ffffff" font-weight="700" text-anchor="middle"  data-layer-name="Slogan">নারীর ক্ষমতায়ন, উন্নয়নের অঙ্গীকার</text>
<text x="105" y="258" font-size="5.8" fill="#ffe600" font-weight="700" text-anchor="middle"  data-layer-name="Appeal">আপনাদের দোয়া ও সমর্থন প্রত্যাশী</text>
<circle cx="30" cy="252" r="13.2" fill="#ffe600"  data-layer-name="Symbol ring"/>
<circle cx="30" cy="252" r="11.5" fill="#ffffff" stroke="#e4172b" stroke-width="0.8" stroke-dasharray="2 1.2" id="symbol_placeholder" data-object-type="image" data-layer-name="প্রতীক বৃত্ত"/>
<text x="30" y="253.5" font-size="4.37" fill="#6b7280" font-weight="500" text-anchor="middle" id="symbol_placeholder_hint" data-layer-name="প্রতীক hint">প্রতীক</text>
<polygon points="180,237 195,252 180,267 165,252" fill="#e4172b" stroke="#ffe600" stroke-width="0.8" data-layer-name="Vote diamond"/>
<text x="180" y="251" font-size="4.8" fill="#ffe600" font-weight="800" text-anchor="middle"  data-layer-name="Vote 1">ভোট</text>
<text x="180" y="257" font-size="4.8" fill="#ffe600" font-weight="800" text-anchor="middle"  data-layer-name="Vote 2">দিন</text>
<rect x="0" y="270" width="210" height="27" rx="0" fill="#0a7a3c"  data-layer-name="Contact strip"/>
<rect x="0" y="270" width="210" height="1.4" rx="0" fill="#ffe600"  data-layer-name="Contact line"/>
<text x="105" y="280" font-size="5" fill="#ffffff" font-weight="700" text-anchor="middle"  data-layer-name="Campaign by">প্রচারে: এলাকার সর্বস্তরের জনগণ।</text>
<text x="105" y="289" font-size="5.6" fill="#ffe600" font-weight="800" text-anchor="middle"  data-layer-name="Contact">যোগাযোগ: ০১XXX-XXXXXX</text>
</svg>
