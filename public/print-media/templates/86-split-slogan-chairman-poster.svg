<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm" font-family="'Hind Siliguri', 'Noto Sans Bengali', 'Nirmala UI', sans-serif">
<rect x="0" y="0" width="210" height="297" rx="0" fill="#27269b" data-layer-name="Background"/>
<circle cx="40" cy="112" r="62" fill="#3433b0" data-layer-name="Soft circle"/>
<circle cx="184" cy="236" r="36" fill="#3433b0" data-layer-name="Soft circle 2"/>
<polygon points="0,0 210,0 210,30 0,42" fill="#e4172b" data-layer-name="Header"/>
<polygon points="0,42 210,30 210,33 0,45" fill="#ffe600" data-layer-name="Header line"/>
<text x="105" y="13" font-size="7.2" fill="#ffe600" font-weight="800" text-anchor="middle" data-layer-name="Election title">ইউনিয়ন পরিষদ নির্বাচন ২০২৬</text>
<rect x="52" y="17" width="106" height="12" rx="6" fill="#c2218f" data-layer-name="Post pill"/>
<text x="105" y="25.6" font-size="6.4" fill="#ffffff" font-weight="800" text-anchor="middle" data-layer-name="Post title">চেয়ারম্যান পদপ্রার্থী</text>
<text x="9" y="66" font-size="12" fill="#ffffff" font-weight="700" text-anchor="start" data-layer-name="Slogan 1">আপনার</text>
<text x="9" y="90" font-size="25" fill="#ffe600" font-weight="800" text-anchor="start" stroke="#7a0010" stroke-width="1.75" stroke-linejoin="round" paint-order="stroke" data-layer-name="Slogan 2">ভোট</text>
<text x="9" y="108" font-size="12" fill="#ffffff" font-weight="700" text-anchor="start" data-layer-name="Slogan 3">আমার</text>
<text x="9" y="134" font-size="25" fill="#ffe600" font-weight="800" text-anchor="start" stroke="#7a0010" stroke-width="1.75" stroke-linejoin="round" paint-order="stroke" data-layer-name="Slogan 4">আমানত</text>
<rect x="9" y="142" width="40" height="2.2" rx="1" fill="#e4172b" data-layer-name="Slogan line"/>
<circle cx="48" cy="166" r="18" fill="#ffffff" stroke="#e4172b" stroke-width="0.8" stroke-dasharray="2 1.2" id="symbol_placeholder" data-object-type="image" data-layer-name="প্রতীক বৃত্ত"/>
<text x="48" y="167.5" font-size="6.84" fill="#6b7280" font-weight="500" text-anchor="middle" data-layer-name="প্রতীক hint">প্রতীক</text>
<text x="48" y="194" font-size="5" fill="#ffffff" font-weight="700" text-anchor="middle" data-layer-name="Symbol label">মার্কা: ____</text>
<rect x="104" y="52" width="100" height="150" rx="5" fill="#c2218f" data-layer-name="Photo shadow"/>
<rect x="99" y="47" width="100" height="150" rx="5" fill="#ffe600" data-layer-name="Photo frame"/>
<rect x="102" y="50" width="94" height="144" rx="3" fill="#e5e7eb" stroke="#9ca3af" stroke-width="0.5" stroke-dasharray="2 1.2" id="photo_placeholder" data-object-type="image" data-layer-name="ছবি"/>
<text x="149.0" y="123.5" font-size="4" fill="#6b7280" font-weight="500" text-anchor="middle" id="photo_placeholder_hint" data-layer-name="ছবি hint">প্রার্থীর ছবি দিন</text>
<rect x="0" y="205" width="210" height="2" rx="0" fill="#ffe600" data-layer-name="Name top line"/>
<rect x="0" y="207" width="210" height="32" rx="0" fill="#c2218f" data-layer-name="Name block"/>
<text x="105" y="230" font-size="19" fill="#ffe600" font-weight="800" text-anchor="middle" stroke="#7a0010" stroke-width="1.33" stroke-linejoin="round" paint-order="stroke" data-layer-name="Candidate name">প্রার্থীর নাম</text>
<rect x="0" y="239" width="210" height="16" rx="0" fill="#0a7a3c" data-layer-name="Appeal band"/>
<text x="105" y="250" font-size="8" fill="#ffffff" font-weight="800" text-anchor="middle" data-layer-name="Appeal">আপনাদের দোয়া ও সমর্থন প্রত্যাশী</text>
<rect x="0" y="255" width="210" height="42" rx="0" fill="#ffe600" data-layer-name="Contact strip"/>
<text x="105" y="271" font-size="5.6" fill="#e4172b" font-weight="800" text-anchor="middle" data-layer-name="Campaign by">প্রচারে: এলাকার সর্বস্তরের জনগণ।</text>
<text x="105" y="280" font-size="5.2" fill="#7a0010" font-weight="700" text-anchor="middle" data-layer-name="Contact">যোগাযোগ: ০১XXX-XXXXXX</text>
<text x="105" y="289" font-size="4.6" fill="#27269b" font-weight="700" text-anchor="middle" data-layer-name="Tagline">আপনার একটি ভোট, এলাকার উন্নয়নের অঙ্গীকার</text>
</svg>
