<text x="105" y="34" font-size="7" fill="#facc15" font-weight="700" text-anchor="middle"  data-layer-name="Greeting">আলহামদুলিল্লাহ</text>
<text x="105" y="54" font-size="15" fill="#ffffff" font-weight="800" text-anchor="middle"  data-layer-name="Main title">বিজয়ের কৃতজ্ঞতা</text>
<circle cx="105" cy="115" r="43" fill="#facc15"  data-layer-name="Photo ring"/>
<circle cx="105" cy="115" r="40" fill="#e5e7eb" stroke="#9ca3af" stroke-width="0.5" stroke-dasharray="2 1.2" id="photo_placeholder" data-object-type="image" data-layer-name="ছবি"/>
<text x="105" y="116" font-size="4" fill="#6b7280" font-weight="500" text-anchor="middle" id="photo_placeholder_hint" data-layer-name="ছবি hint">প্রার্থীর ছবি দিন</text>
<text x="105" y="178" font-size="16" fill="#facc15" font-weight="800" text-anchor="middle"  data-layer-name="Candidate name">প্রার্থীর নাম</text>
<text x="105" y="190" font-size="6" fill="#ffffff" font-weight="600" text-anchor="middle"  data-layer-name="Post">নির্বাচিত চেয়ারম্যান / মেম্বার</text>
<text x="105" y="206" font-size="5.3" fill="#e0e7ff" font-weight="500" text-anchor="middle"  data-layer-name="Thanks line 1">আপনাদের ভালোবাসা, দোয়া ও ভোটে আমি বিজয়ী হয়েছি।</text>
<text x="105" y="215" font-size="5.3" fill="#e0e7ff" font-weight="500" text-anchor="middle"  data-layer-name="Thanks line 2">আমি আজীবন আপনাদের সেবক হয়ে কাজ করে যাবো।</text>
<rect x="45" y="228" width="120" height="15" rx="7.5" fill="#facc15"  data-layer-name="Message ribbon"/>
<text x="105" y="238.5" font-size="7" fill="#1e1b4b" font-weight="800" text-anchor="middle"  data-layer-name="Ribbon text">সবাইকে আন্তরিক ধন্যবাদ</text>
<text x="105" y="262" font-size="5" fill="#c7d2fe" font-weight="600" text-anchor="middle"  data-layer-name="Signature">বিনীত— প্রার্থীর নাম ও সমর্থকবৃন্দ</text>
<text x="105" y="275" font-size="4.6" fill="#a5b4fc" font-weight="500" text-anchor="middle"  data-layer-name="Contact">যোগাযোগ: ০১XXX-XXXXXX</text>
