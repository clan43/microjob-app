<polygon points="184.00,244.00 185.59,247.82 189.71,248.15 186.57,250.83 187.53,254.85 184.00,252.70 180.47,254.85 181.43,250.83 178.29,248.15 182.41,247.82" fill="#facc15" data-layer-name="Star 4"/>
