<rect x="8" y="8" width="194" height="281" rx="4" fill="none" stroke="#facc15" stroke-width="0.8" data-layer-name="Frame"/>
<polygon points="30.00,24.00 31.59,27.82 35.71,28.15 32.57,30.83 33.53,34.85 30.00,32.70 26.47,34.85 27.43,30.83 24.29,28.15 28.41,27.82" fill="#facc15" data-layer-name="Star 1"/>
