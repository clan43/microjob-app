<text x="40" y="228" font-size="4.6" fill="#7f1d1d" font-weight="600" text-anchor="middle"  data-layer-name="Pledge 1">রাস্তা ও নালা</text>
<circle cx="89" cy="212" r="8" fill="#9f1239"  data-layer-name="Pledge circle 2"/>
<text x="89" y="214.5" font-size="7" fill="#ffffff" font-weight="800" text-anchor="middle"  data-layer-name="Pledge no 2">2</text>
<text x="89" y="228" font-size="4.6" fill="#7f1d1d" font-weight="600" text-anchor="middle"  data-layer-name="Pledge 2">নিরাপদ পানি</text>
<circle cx="138" cy="212" r="8" fill="#9f1239"  data-layer-name="Pledge circle 3"/>
<text x="138" y="214.5" font-size="7" fill="#ffffff" font-weight="800" text-anchor="middle"  data-layer-name="Pledge no 3">3</text>
<text x="138" y="228" font-size="4.6" fill="#7f1d1d" font-weight="600" text-anchor="middle"  data-layer-name="Pledge 3">বিদ্যুৎ ও আলো</text>
<circle cx="187" cy="212" r="8" fill="#9f1239"  data-layer-name="Pledge circle 4"/>
<text x="187" y="214.5" font-size="7" fill="#ffffff" font-weight="800" text-anchor="middle"  data-layer-name="Pledge no 4">4</text>
<text x="187" y="228" font-size="4.6" fill="#7f1d1d" font-weight="600" text-anchor="middle"  data-layer-name="Pledge 4">সবার সেবা</text>
<rect x="25" y="238" width="160" height="34" rx="5" fill="#ffffff" stroke="#9f1239" stroke-width="0.5" data-layer-name="Symbol box"/>
