<text x="48" y="256.2" font-size="4.94" fill="#6b7280" font-weight="500" text-anchor="middle"  data-layer-name="প্রতীক hint">প্রতীক</text>
<text x="70" y="251" font-size="5" fill="#7f1d1d" font-weight="700" text-anchor="start"  data-layer-name="Vote line">আপনার ভোট দিন আমার প্রতীকে</text>
<text x="70" y="261" font-size="4.6" fill="#9f1239" font-weight="700" text-anchor="start"  data-layer-name="Symbol name">প্রতীক: ______</text>
<text x="105" y="283" font-size="5" fill="#7f1d1d" font-weight="700" text-anchor="middle"  data-layer-name="Contact">যোগাযোগ: ০১XXX-XXXXXX</text>
</svg>
